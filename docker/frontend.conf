server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 64m;
    client_body_timeout 30s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /frontend-health {
        access_log off;
        return 200 'ok';
        default_type text/plain;
    }

    location /api/ {
        # Docker DNS refresh lets API routing survive backend container recreation.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $fleet_backend android-manager:8000;
        proxy_pass http://$fleet_backend;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Origin $http_origin;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @backend_unavailable;
    }

    location @backend_unavailable {
        default_type application/json;
        return 503 '{"error":{"code":"backend_unavailable","message":"The backend is unavailable. Retry shortly."}}';
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
